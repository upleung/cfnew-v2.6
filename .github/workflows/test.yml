name: Validate CF-New Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '明文源吗'
      - 'scripts/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - master
    paths:
      - '明文源吗'
      - 'scripts/**'
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: cfnew-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  OBFUSCATOR_VERSION: '5.7.0'

jobs:
  validate:
    name: Syntax + Obfuscation + Package Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install exact obfuscator version
        run: npm install --no-save --no-package-lock --ignore-scripts "javascript-obfuscator@${OBFUSCATOR_VERSION}"

      - name: Run validation
        run: node scripts/validate.mjs

      - name: Test Pages.zip
        shell: bash
        run: |
          set -euo pipefail
          rm -f Pages.zip
          (cd dist && zip -9 ../Pages.zip _worker.js)
          unzip -t Pages.zip
          unzip -p Pages.zip _worker.js > /tmp/pages-worker.js
          cmp --silent /tmp/pages-worker.js dist/_worker.js
          echo 'Pages.zip validation: PASS'
