name: Deploy Worker Script

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# 核心修复：授予 GITHUB_TOKEN 创建 Release 和上传文件的权限
permissions:
  contents: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get tag name
        id: get_tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "当前标签: $TAG_NAME"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if source file exists
        run: |
          if [ ! -f "少年你相信光吗" ]; then
            echo "错误：在项目根目录未找到 '少年你相信光吗' 文件。"
            exit 1
          fi
          echo "成功找到源文件 '少年你相信光吗'"
      
      - name: Rename file to _worker.js
        run: |
          cp "少年你相信光吗" "_worker.js"
          echo "成功将 '少年你相信光吗' 复制为 '_worker.js'"
      
      - name: Create zip file
        run: |
          zip Pages.zip _worker.js
          echo "成功压缩为 'Pages.zip'"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: Release ${{ steps.get_tag.outputs.tag_name }}
          body: |
            ## 部署信息
            
            - **打包产物**: `Pages.zip` (内部包含混淆后的 `_worker.js`)
            - **部署标签**: ${{ steps.get_tag.outputs.tag_name }}
            - **自动构建**: 包含最新反风控混淆与毛玻璃 UI。
          draft: false
          prerelease: false
          files: Pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}